<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="admin-wrap">
  <div style="text-align:right; margin-bottom: 10px;">
    <a href="manage.html" style="font-size:0.9rem; color:#111;">Manage existing products →</a>
  </div>
  <h2>Add New Product</h2>

  <form id="productForm">
    <label>Product Name</label>
    <input type="text" id="name" required>

    <label>Description</label>
    <textarea id="description" rows="3"></textarea>

    <label>Price (KSh)</label>
    <input type="number" id="price" required>

    <label>Sale Price (optional)</label>
    <input type="number" id="salePrice">

    <label>Category</label>
    <select id="category" required>
      <option value="men">Men</option>
      <option value="women">Women</option>
      <option value="unisex">Unisex</option>
      <option value="children">Children</option>
    </select>

    <label>
      <input type="checkbox" id="isNew" style="width:auto; display:inline-block;" checked>
      Mark as New
    </label>

    <label>Product Image</label>
    <input type="file" id="imageFile" accept="image/*" required>
    <img id="preview" alt="Preview">

    <button type="submit" id="submitBtn">Add Product</button>
    <div id="status"></div>
  </form>
</div>

<script src="config.js"></script>
<script>
document.getElementById('imageFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
});

// Reads a File into a base64 string (no data-URL prefix) for sending as
// JSON to /api/upload.
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('productForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  submitBtn.disabled = true;
  status.textContent = 'Uploading image...';

  const imageFile = document.getElementById('imageFile').files[0];

  try {
    // Step 1: upload image to Vercel Blob (via our own /api/upload function).
    // Sent as base64 JSON rather than a raw binary body — see the comment
    // at the top of api/upload.js for why.
    const dataBase64 = await fileToBase64(imageFile);
    const uploadRes = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: imageFile.name,
        contentType: imageFile.type,
        dataBase64
      })
    });
    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) throw new Error(uploadData.error || 'Image upload failed');

    status.textContent = 'Saving product...';

    // Step 2: create product in FastAPI backend
    const productRes = await fetch(`${API_URL}/admin/products`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        price: parseFloat(document.getElementById('price').value),
        sale_price: document.getElementById('salePrice').value ? parseFloat(document.getElementById('salePrice').value) : null,
        category: document.getElementById('category').value,
        is_new: document.getElementById('isNew').checked
      })
    });
    const productData = await productRes.json();
    if (!productRes.ok) throw new Error(productData.detail || 'Product creation failed');

    // Step 3: link uploaded image to the new product
    const imgRes = await fetch(`${API_URL}/admin/products/${productData.id}/images`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ blob_url: uploadData.url, is_primary: true })
    });
    if (!imgRes.ok) throw new Error('Image linking failed');

    status.textContent = '✅ Product added successfully!';
    document.getElementById('productForm').reset();
    document.getElementById('preview').style.display = 'none';

  } catch (err) {
    status.textContent = '❌ Error: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
